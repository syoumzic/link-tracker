stages:
  - build-and-test

variables:
  GITLAB_DOCKER_PROXY: gitlab.education.tbank.ru:443/backend-academy-scala-2025/lecture-materials/dependency_proxy/containers

mr-block:
  stage: build-and-test
  interruptible: true
  allow_failure: false
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - .gitlab-ci.yml
        - .scalafix.conf
    - when: never
  script:
    - echo "Please don't change service files"
    - exit 1

mr-build:
  image: sbtscala/scala-sbt:eclipse-temurin-alpine-21.0.8_9_1.11.6_2.13.16
  stage: build-and-test
  interruptible: true
  allow_failure: false
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "${DOCKER_TLS_CERTDIR}/client"
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "${GITLAB_DOCKER_PROXY}/"
  tags:
    - dind
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - apk add --no-cache docker-cli
    - echo "$CI_JOB_TOKEN" | docker login gitlab.education.tbank.ru:443 -u gitlab-ci-token --password-stdin

  needs:
    - job: mr-block
      optional: true
      artifacts: false
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - when: never
  script:
    - docker pull ${GITLAB_DOCKER_PROXY}/alpine:latest
    - sbt "scalafmtCheckAll; scalafmtSbtCheck; scalafixEnable; scalafixAll --check; compile; test"


master-build:
  image: sbtscala/scala-sbt:eclipse-temurin-alpine-21.0.8_9_1.11.6_2.13.16
  stage: build-and-test
  interruptible: true
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  script:
    - sbt "scalafmtCheckAll; scalafmtSbtCheck; scalafixEnable; scalafixAll --check; compile"
